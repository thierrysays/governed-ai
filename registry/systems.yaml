# AI systems and use cases. risk_class follows the EU AI Act tiers: unacceptable | high | limited | minimal.
# Classification of a real system must be justified in docs/governance/system-register.md.
# name_en and name_fr are mandatory.
# allowed_data_classes: ceiling for the system, intersected with each model's own clearance by policies/routing.rego.
systems:
  - id: example-internal-assistant
    name_en: Example internal assistant
    name_fr: Exemple d'assistant interne
    synthetic: true
    status: candidate
    risk_class: limited
    owner: business-unit
    accountable: to-be-assigned
    human_oversight: required
    allowed_data_classes: [public]
    models: [example-small-model]
    tools: [example-read-tool]

  # First real use case. Candidate: not approvable until an accountable person, a model and an evaluation exist.
  # Justification: docs/governance/use-cases/internal-assistant.md (and _FR), decision: docs/adr/0003 (and _FR).
  - id: internal-assistant
    name_en: Internal assistant
    name_fr: Assistant interne
    status: candidate
    risk_class: limited
    owner: to-be-assigned
    accountable: to-be-assigned
    human_oversight: sampling
    allowed_data_classes: [public, internal]
    models: []
    tools: []
